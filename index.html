  $('tabs').innerHTML = [['Equipo','EQUIPOS'],['Combo','COMBOS']].map(([k,l])=>`<button class="tab${S.tab===k?' on':''}" data-k="${k}">${l}<b>${n(k)}</b></button>`).join('');
  $('plans').innerHTML = PLANS.map(p=>`<button class="plan${p===S.p?' on':''}" data-p="${p}"><small>PLAN</small>${p}<em>$${RENTA[p].ab.toLocaleString('es-MX')}</em></button>`).join('');
  $('filt').innerHTML = FILTERS.map(([v,l])=>`<button class="f${v===S.f?' on':''}" data-f="${v}">${l}</button>`).join('');
  $('sort').value = S.sort;
}
function render(){
  renderBars();
  const q = S.q.trim().toUpperCase().split(/\s+/).filter(Boolean);
  const mq = d => !q.length || q.every(t=>/^\d{5,}$/.test(t) ? d.sap.includes(t) : (d.short+' '+d.acc+(t.includes('-')?' '+d.n:'')).toUpperCase().includes(t));
  const mf = d => {
    if(S.f==='inc' && !d.inc) return false;
    if(S.f==='bono' && !d.b) return false;
    if(S.f==='exp'){ const x=left(d); if(x===null || x>15) return false; }
    return true;
  };
  let L = DATA.filter(d=>d.cat===S.tab && mq(d) && mf(d));
  const hidF = DATA.filter(d=>d.cat===S.tab && mq(d) && !mf(d)).length;
  const other = S.tab==='Combo'?'Equipo':'Combo';
  const hidT = q.length ? DATA.filter(d=>d.cat===other && mq(d) && mf(d)).length : 0;
  const FL = {inc:'$ INCENTIVO',bono:'BONO',exp:'! VENCE'};
  let hint = '';
  if(S.f!=='all' && hidF) hint += `<button class="hint" data-act="all">> ${hidF} ${hidF===1?'oculto':'ocultos'} por filtro ${FL[S.f]} · <u>VER TODOS</u></button>`;
  if(hidT) hint += `<button class="hint" data-act="tab">> ${hidT} en ${other==='Combo'?'COMBOS':'EQUIPOS'} · <u>VER</u></button>`;
  const pv = d => { const v=price(d); return v===null ? 1e9 : v; };
  const cmp = {inc:(a,b)=>b.inc-a.inc||pv(a)-pv(b), pa:(a,b)=>pv(a)-pv(b), pd:(a,b)=>(price(b)??-1)-(price(a)??-1), az:(a,b)=>a.short.localeCompare(b.short)};
  L.sort(cmp[S.sort]);
  $('count').textContent = `> ${L.length} ${S.tab==='Combo'?'combos':'equipos'} · ${pl(S.p).toLowerCase()}`;
  $('list').innerHTML = L.length ? L.map(d=>{
    const v=price(d), x=left(d);
    return `<div class="card${d.inc?' hasinc':''}" data-i="${d.i}">
      <div class="info"><div class="nm">${d.short}</div>${d.acc?`<div class="acc">+ ${d.acc}</div>`:''}
        <div class="tags">${d.inc?`<span class="t inc">+${money(d.inc)}</span>`:''}${d.b?'<span class="t bono">BONO</span>':''}
        <span class="t">${d.t}</span>${x!==null&&x<=15?`<span class="t exp">EXP ${d.a.slice(0,5)}</span>`:''}</div></div>
      <div class="pr"><b class="${v===0?'free':''}">${fmt(v)}</b><small>${v===null?'NO APLICA':pl(S.p).toUpperCase()+' · $'+RENTA[S.p].ab.toLocaleString('es-MX')+'/MES'}</small></div></div>`;
  }).join('') + hint : (hint ? '<div class="empty" style="padding:24px 0 12px">> 0 resultados con este filtro</div>'+hint : '<div class="empty">> 0 resultados. prueba otra búsqueda</div>');
}
function openD(d){
  const v=price(d), x=left(d);
  $('sh').innerHTML = `<div class="grab"></div>
   <div class="hd"><button class="x" id="cl" aria-label="Cerrar">✕</button>
     <h2>${d.short}</h2>${d.acc?`<div class="acc">+ ${d.acc}</div>`:''}
     <div class="big"><div><span>${pl(S.p).toUpperCase()}${d.pad?" · TABLET":" · 24M"}</span><b>${fmt(v)}</b></div>
     ${d.inc?`<div class="ib"><span>TU INCENTIVO</span><b>${money(d.inc)}</b></div>`:''}</div></div>
   <div class="body">
     ${RENTA[S.p]?`<div class="sec"><h3>${pl(S.p).toUpperCase()} + EQUIPO</h3>
       <div class="i3"><div><span>Equipo</span><b>${fmt(v)}</b></div><div><span>Plan /mes</span><b>${money(RENTA[S.p].ab)}</b></div><div class="tot"><span>Total</span><b>${v===null?'N/A':money(Math.round((v+RENTA[S.p].ab)*100)/100)}</b></div></div></div>`:''}
     <div class="sec"><h3>PRECIO_X_PLAN ${d.pad?'[TABLET]':'[24M]'}</h3><div class="grid">
       ${plansOf(d).map((p,i)=>{const v=valsOf(d)[i];return `<button class="c${p===S.p?' on':''}${PLANS.includes(p)?'':' dis'}" data-p="${p}"><span>${pl(p)}${RENTA[p]?` · $${RENTA[p].ab.toLocaleString('es-MX')}`:''}</span><b class="${v===0?'free':''}">${v===0?'Gratis':money(v)}</b></button>`}).join('')}
     </div></div>
     <div class="sec"><h3>INCENTIVO_VENDEDOR</h3><div class="i3">
       <div><span>Equipo</span><b>${money(d.ie||0)}</b></div><div><span>Accesorio</span><b>${money(d.ia||0)}</b></div><div class="tot"><span>Total</span><b>${money(d.inc)}</b></div></div>
       <div class="note">${d.b?'[OK] Cuenta para Bono+KPI. ':'[--] Sin bono. '}Si no llegas al 60% del target se paga solo el 60%.${/600 ELITE/i.test(d.n)?'<br>[★] 600 Elite: +$400/$300/$200 según target (100/80/&lt;80%) y +$2,000 si vende ≥ Samsung A57 en tienda.':''}</div></div>
     <div class="sec"><h3>DATA</h3>
       <div class="kv"><span>Tipo</span><b>${d.k} · ${d.t}</b></div>
       <div class="kv"><span>Clave SAP</span><b>${d.sap}</b></div>
       <div class="kv"><span>Vigencia</span><b>hasta ${d.a}${x!==null?` · ${x} días`:''}</b></div>
       <div class="kv"><span>Nombre completo</span><b style="font-size:12px">${d.n}</b></div></div>
   </div>
   <div class="foot"><button class="cta" id="cp">[ COPIAR COTIZACIÓN ]</button></div>`;
  $('m').classList.add('open'); document.body.style.overflow='hidden';
  $('cl').onclick = close;
  $('sh').querySelectorAll('.c').forEach(b=>b.onclick=()=>{if(!PLANS.includes(b.dataset.p))return; S.p=b.dataset.p; save(); render(); openD(d);});
  $('cp').onclick = () => {
    const r=RENTA[S.p], pv=price(d); const t = `📱 HONOR ${d.short}${d.acc?' + '+d.acc:''}\n${pl(S.p)}${d.pad?'':' · 24 meses'}\nEquipo: ${fmt(pv)}${r?`\nPlan: ${money(r.ab)}/mes${pv!==null?`\nTotal: ${money(Math.round((pv+r.ab)*100)/100)}`:''}`:''}`;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast('> cotización copiada'),()=>toast('No se pudo copiar'));
  };
}
function close(){ $('m').classList.remove('open'); document.body.style.overflow=''; }
function toast(t){ const e=$('toast'); e.textContent=t; e.style.opacity=1; setTimeout(()=>e.style.opacity=0,1600); }
$('tabs').onclick = e => { const b=e.target.closest('.tab'); if(b){ S.tab=b.dataset.k; S.f='all'; save(); render(); window.scrollTo(0,0);} };
$('plans').onclick = e => { const b=e.target.closest('.plan'); if(b){ S.p=b.dataset.p; save(); render(); } };
$('filt').onclick = e => { const b=e.target.closest('.f'); if(b){ S.f=b.dataset.f; save(); render(); } };
$('list').onclick = e => { const h=e.target.closest('.hint'); if(h){ if(h.dataset.act==='all') S.f='all'; else { S.tab=(S.tab==='Combo'?'Equipo':'Combo'); S.f='all'; } save(); render(); return; } const c=e.target.closest('.card'); if(c) openD(DATA[+c.dataset.i]); };
$('ov').onclick = close;
document.addEventListener('keydown', e => { if(e.key==='Escape') close(); });
$('q').oninput = e => { S.q=e.target.value; $('clr').style.display=S.q?'block':'none'; render(); };
$('clr').onclick = () => { $('q').value=''; S.q=''; $('clr').style.display='none'; render(); $('q').focus(); };
$('sort').onchange = e => { S.sort=e.target.value; save(); render(); };
render();
setTimeout(()=>{ const on=document.querySelector('.plan.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'}); },0);
</script>
</body>
</html>
